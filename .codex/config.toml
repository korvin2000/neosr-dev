[code]
optimize = "speed"
reliability = "high"
comments = "medium"

[project]
language = "python"
machine_learning_library = "PyTorch"
documenation = "Markdown"

[formatting]
quote-style = "double"
indent-style = "space"
indent = 4
max_line_length = 88
split-on-trailing-comma = false
skip-magic-trailing-comma = true
line-ending = "lf"