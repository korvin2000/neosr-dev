<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // The theme before first paint, so a light page never flashes dark; ThemeService owns it after boot.
    (function () {
      var choice;
      try {
        choice = JSON.parse(localStorage.getItem('neosr-studio.settings.v1') || '{}').theme;
      } catch (e) {}
      var light = choice === 'light' || (choice !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
