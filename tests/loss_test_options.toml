# Minimal options file so `import neosr` (which parses sys.argv at import) works in tests.
name = "pytest_losses"
model_type = "image"
scale = 4
manual_seed = 1024

[datasets.train]
type = "paired"
dataroot_gt = "/tmp/neosr_pytest/gt"
dataroot_lq = "/tmp/neosr_pytest/lq"
patch_size = 64
batch_size = 2

[network_g]
type = "esrgan"

[train.optim_g]
type = "adan_sf"
lr = 8e-4

[logger]
total_iter = 10
